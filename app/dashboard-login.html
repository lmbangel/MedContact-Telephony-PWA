<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Login - MedContact</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="/src/dashboard-login.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="h-screen overflow-hidden">
  <div class="flex h-full">

    <!-- Left Side - Login Form -->
    <div class="w-full lg:w-2/5 bg-white flex items-center justify-center p-8 overflow-y-auto">
      <div class="w-full max-w-md">

        <!-- Logo -->
        <div class="mb-8">
          <div class="flex items-center gap-3 mb-6">
            <div class="w-12 h-12 bg-red-500 rounded-full flex items-center justify-center">
              <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
              </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">MedContact</h1>
          </div>
          <p class="text-gray-700 font-medium">Sign in to start your session</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-5">

          <!-- Email Field -->
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
              placeholder="eg. joe@medcontact.co.za"
            >
            <p class="text-xs text-red-500 mt-1 hidden" id="emailError">This field is required</p>
          </div>

          <!-- Password Section (default) -->
          <div id="passwordSection">
            <div class="flex items-center justify-between mb-2">
              <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
              <button type="button" id="toggleOtpBtn" class="text-xs text-red-500 hover:text-red-600 font-medium">
                Use OTP instead
              </button>
            </div>
            <div class="relative">
              <input
                type="password"
                id="password"
                name="password"
                class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm pr-10"
                placeholder="Password"
              >
              <button type="button" id="togglePasswordVisibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              </button>
            </div>
            <div class="flex items-center justify-between mt-1">
              <p class="text-xs text-red-500 hidden" id="passwordError">This field is required</p>
              <a href="#" class="text-xs text-gray-600 hover:text-gray-800 ml-auto">Forgot password?</a>
            </div>
          </div>

          <!-- OTP Section (hidden by default) -->
          <div id="otpSection" class="hidden">
            <div class="flex items-center justify-between mb-2">
              <label for="otp" class="block text-sm font-medium text-gray-700">OTP Code</label>
              <button type="button" id="togglePasswordBtn" class="text-xs text-red-500 hover:text-red-600 font-medium">
                Use Password instead
              </button>
            </div>
            <div class="flex gap-2">
              <input
                type="text"
                id="otp"
                name="otp"
                maxlength="6"
                pattern="[0-9]{6}"
                class="flex-1 px-4 py-2.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-center text-lg tracking-widest"
                placeholder="000000"
              >
              <button
                type="button"
                id="sendOtpBtn"
                class="px-4 bg-gray-800 text-white py-3 rounded-md hover:bg-gray-900 transition font-medium text-sm flex items-center justify-center gap-2 group"
              >
                Send OTP
              </button>
            </div>
            <p id="otpTimer" class="text-xs text-gray-500 mt-1.5 hidden"></p>
          </div>

          <!-- Error Message -->
          <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-2.5 rounded-md text-sm"></div>

          <!-- Sign In Button -->
          <button
            type="submit"
            id="submitBtn"
            class="w-full bg-gray-800 text-white py-3 rounded-md hover:bg-gray-900 transition font-medium text-sm flex items-center justify-center gap-2 group"
          >
            Sign in
            <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </button>

          <!-- Divider -->
          <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-xs">
              <span class="px-3 bg-white text-gray-500">Or login with</span>
            </div>
          </div>

          <!-- Social Login Buttons -->
          <div class="grid grid-cols-2 gap-3">
            <button
              type="button"
              disabled
              class="flex items-center justify-center gap-2 px-4 py-2.5 border border-gray-300 rounded-md bg-white hover:bg-gray-50 transition text-sm font-medium text-gray-700 cursor-not-allowed opacity-60"
            >
              <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              Google
            </button>
            <button
              type="button"
              disabled
              class="flex items-center justify-center gap-2 px-4 py-2.5 border border-gray-300 rounded-md bg-white hover:bg-gray-50 transition text-sm font-medium text-gray-700 cursor-not-allowed opacity-60"
            >
              <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#00A4EF" d="M11.4 24H0V8h11.4v16z"/>
                <path fill="#FFB900" d="M24 8v16h-11.4V8H24z"/>
                <path fill="#F25022" d="M11.4 0v6.8H0V0h11.4z"/>
                <path fill="#7FBA00" d="M24 0v6.8H12.6V0H24z"/>
              </svg>
              Microsoft
            </button>
          </div>

        </form>

        <!-- Footer -->
        <div class="mt-8 space-y-4">
          <div class="text-center">
            <p class="text-sm text-gray-600">
              Need Help?
              <a href="#" class="text-red-500 hover:text-red-600 font-medium">Click here for Support</a>
            </p>
          </div>
          <div class="text-center text-xs text-gray-500 space-x-2">
            <a href="#" class="hover:text-gray-700">Privacy</a>
            <span>/</span>
            <a href="#" class="hover:text-gray-700">Terms & Conditions</a>
            <span>/</span>
            <span>v. 1.0</span>
            <span>© MedContact 2025</span>
          </div>
        </div>

      </div>
    </div>

    <!-- Right Side - Image -->
    <div class="hidden lg:block lg:w-3/5 relative">
      <!-- Background Image (you can replace with actual image URL) -->
      <img
        src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=1200&q=80"
        alt="Professional woman on phone"
        class="w-full h-full object-cover"
      />

      <!-- Decorative Dots Pattern -->
      <div class="absolute top-8 right-8 grid grid-cols-8 gap-2 opacity-50">
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>

        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>

        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>

        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
        <div class="w-2 h-2 rounded-full bg-red-500"></div>
      </div>
    </div>

  </div>
</body>
</html>
