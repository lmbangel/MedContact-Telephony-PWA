<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats - MedContact</title>
  <link rel="icon" href="/app/favicon.ico" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="/src/dashboard-stats.js"></script>
</head>

<body class="bg-gray-50 min-h-screen">

  <!-- Sidebar -->
  <aside id="app-sidebar"
    class="fixed left-0 top-0 h-full w-16 bg-[#1e3a5f] flex flex-col items-center py-4 gap-4 z-50">
    <!-- Menu Toggle -->
    <button id="side-menu-icon" class="w-10 h-10 flex items-center justify-center text-white hover:bg-white/10 rounded-lg transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <!-- Navigation Icons -->
    <button id="side-dashboard-icon" class="w-10 h-10 flex items-center justify-center text-white hover:bg-white/10 rounded-lg transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
        </path>
      </svg>
    </button>

    <!-- Stats Icon (Active) -->
    <button id="side-stats-icon" class="w-10 h-10 flex items-center justify-center text-white bg-rose-500 rounded-lg transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
        </path>
      </svg>
    </button>

    <!-- Call Icon -->
    <button id="side-phone-icon" class="w-10 h-10 flex items-center justify-center text-white hover:bg-white/10 rounded-lg transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z">
        </path>
      </svg>
    </button>

    <button class="w-10 h-10 flex items-center justify-center text-white hover:bg-white/10 rounded-lg transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
        </path>
      </svg>
    </button>

    <button class="w-10 h-10 flex items-center justify-center text-white hover:bg-white/10 rounded-lg transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
        </path>
      </svg>
    </button>

    <button class="w-10 h-10 flex items-center justify-center text-white hover:bg-white/10 rounded-lg transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
        </path>
      </svg>
    </button>

    <button class="w-10 h-10 flex items-center justify-center text-white hover:bg-white/10 rounded-lg transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
        </path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z">
        </path>
      </svg>
    </button>

    <button class="w-10 h-10 flex items-center justify-center text-white hover:bg-white/10 rounded-lg transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
        </path>
      </svg>
    </button>
  </aside>

  <!-- Main Container with Sidebar Offset -->
  <div class="ml-16">

    <!-- Header -->
    <header id="app-header" class="bg-white border-b border-gray-200 sticky top-0 z-40">
      <div class="px-6 py-4">
        <div class="flex justify-between items-center">
          <!-- Breadcrumb -->
          <div class="flex items-center gap-2 text-sm">
            <span class="text-gray-400">Dashboard</span>
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
            <span class="text-gray-900 font-medium">Stats</span>
          </div>

          <!-- Right Side: Export + Timezone + SSE Status + Notifications + User -->
          <div class="flex items-center gap-4">
            <!-- Export Button -->
            <button id="export-stats-btn" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
              </svg>
              Export CSV
            </button>

            <!-- Timezone Badge -->
            <div id="timezone-display"></div>

            <!-- SSE Connection Status -->
            <div class="flex items-center gap-2 px-3 py-1 bg-gray-100 rounded-lg">
              <span id="sse-status-indicator" class="w-2 h-2 rounded-full bg-gray-400"></span>
              <span id="sse-status-text" class="text-xs text-gray-600">Connecting...</span>
            </div>

            <!-- Notification Bell -->
            <button class="relative p-2 hover:bg-gray-100 rounded-lg transition">
              <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
                </path>
              </svg>
            </button>

            <!-- Status Dropdown -->
            <div class="relative">
              <select id="agentStatus"
                class="appearance-none bg-white border border-gray-300 rounded-lg px-3 py-2 pr-8 text-sm font-medium cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                <option value="available">🟢 Available</option>
                <option value="busy">🔴 Busy</option>
                <option value="on_break">🟡 On Break</option>
                <option value="offline">⚫ Offline</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
              </div>
            </div>

            <!-- User Info -->
            <div class="flex items-center gap-3">
              <div class="text-right">
                <p class="text-sm font-medium text-gray-900" id="headerUserName">Loading...</p>
                <p class="text-xs text-gray-500" id="headerCompanyName">Loading...</p>
              </div>
              <div class="w-10 h-10 bg-gray-300 rounded-full overflow-hidden">
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=User&background=e5e7eb&color=374151"
                  alt="User" class="w-full h-full object-cover">
              </div>
            </div>

            <!-- Logout Button -->
            <button id="logoutBtn"
              class="px-4 py-2 text-sm font-medium text-red-600 hover:text-red-700 hover:bg-red-50 rounded-md transition">
              Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="p-6">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-4">Team Statistics</h1>

        <!-- Company filter (support role only) -->
        <div id="companyFilterContainer" class="hidden mb-6">
          <label for="companyFilter" class="block text-sm font-medium text-gray-700 mb-2">
            Filter by Company
          </label>
          <select id="companyFilter" class="border border-gray-300 rounded-md px-3 py-2 w-full max-w-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">-- Select Company --</option>
          </select>
        </div>

        <!-- Time Filter Controls -->
        <div class="mb-6 bg-white rounded-lg shadow p-4">
          <h3 class="text-lg font-semibold mb-3">Time Period</h3>

          <!-- Quick Filter Buttons -->
          <div class="flex flex-wrap gap-2 mb-4">
            <button id="filter-today" class="px-4 py-2 rounded-lg border-2 border-blue-600 bg-blue-600 text-white font-medium hover:bg-blue-700 transition">
              Today
            </button>
            <button id="filter-yesterday" class="px-4 py-2 rounded-lg border-2 border-gray-300 bg-white text-gray-700 font-medium hover:bg-gray-50 transition">
              Yesterday
            </button>
            <button id="filter-this-week" class="px-4 py-2 rounded-lg border-2 border-gray-300 bg-white text-gray-700 font-medium hover:bg-gray-50 transition">
              This Week
            </button>
            <button id="filter-this-month" class="px-4 py-2 rounded-lg border-2 border-gray-300 bg-white text-gray-700 font-medium hover:bg-gray-50 transition">
              This Month
            </button>
          </div>

          <!-- Custom Date Range -->
          <div class="flex flex-wrap gap-3 items-end">
            <div class="flex-1 min-w-[200px]">
              <label for="start-date" class="block text-sm font-medium text-gray-700 mb-1">
                Start Date
              </label>
              <input
                type="date"
                id="start-date"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              />
            </div>
            <div class="flex-1 min-w-[200px]">
              <label for="end-date" class="block text-sm font-medium text-gray-700 mb-1">
                End Date
              </label>
              <input
                type="date"
                id="end-date"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              />
            </div>
            <button
              id="filter-custom"
              class="px-6 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
            >
              Apply Range
            </button>
          </div>

          <!-- Validation Error Message -->
          <div id="date-error" class="mt-2 text-red-600 text-sm hidden"></div>
        </div>

        <!-- Loading Spinner -->
        <div id="statsLoading" class="flex items-center justify-center py-12" role="status" aria-label="Loading statistics">
          <svg class="animate-spin h-8 w-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="ml-3 text-gray-600">Loading stats...</span>
        </div>

        <!-- Stats Cards -->
        <div id="statsCards" class="hidden">
          <div id="statsContent">
            <p class="text-gray-500">Real-time stats will appear here once implemented in Phase 4.</p>
          </div>
        </div>

        <!-- Chart Visualizations -->
        <div id="chartsContainer" class="mt-8 space-y-6">
          <h2 class="text-xl font-semibold text-gray-900">Trends</h2>

          <!-- Call Volume Line Chart -->
          <div class="bg-white rounded-lg shadow border border-gray-200 p-6">
            <h3 class="text-lg font-medium text-gray-900 mb-4">Call Volume Over Time</h3>
            <div id="callVolumeChart" class="w-full h-80" role="img" aria-label="Call volume trend chart">
            </div>
          </div>

          <!-- Agent Performance Bar Chart -->
          <div class="bg-white rounded-lg shadow border border-gray-200 p-6">
            <h3 class="text-lg font-medium text-gray-900 mb-4">Agent Performance</h3>
            <div id="agentPerformanceChart" class="w-full h-80" role="img" aria-label="Agent performance comparison chart">
            </div>
          </div>
        </div>

        <!-- Per-Agent Breakdown Table -->
        <div id="agentBreakdownContainer" class="hidden mt-8">
          <h2 class="text-xl font-semibold text-gray-900 mb-4">Agent Breakdown</h2>
          <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
            <table id="agentBreakdownTable" class="w-full">
              <thead class="bg-gray-100 border-b border-gray-200">
                <tr>
                  <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700 cursor-pointer hover:bg-gray-200 transition"
                      data-sortable="agent_name" aria-label="Sort by agent name">
                    Agent Name
                    <span class="sort-arrow ml-1">↕</span>
                  </th>
                  <th class="px-4 py-3 text-right text-sm font-semibold text-gray-700 cursor-pointer hover:bg-gray-200 transition"
                      data-sortable="total_calls" aria-label="Sort by total calls">
                    Calls
                    <span class="sort-arrow ml-1">↕</span>
                  </th>
                  <th class="px-4 py-3 text-right text-sm font-semibold text-gray-700 cursor-pointer hover:bg-gray-200 transition"
                      data-sortable="answered_calls" aria-label="Sort by answered calls">
                    Answered
                    <span class="sort-arrow ml-1">↕</span>
                  </th>
                  <th class="px-4 py-3 text-right text-sm font-semibold text-gray-700 cursor-pointer hover:bg-gray-200 transition"
                      data-sortable="avg_duration" aria-label="Sort by average duration">
                    Avg Duration
                    <span class="sort-arrow ml-1">↕</span>
                  </th>
                  <th class="px-4 py-3 text-right text-sm font-semibold text-gray-700 cursor-pointer hover:bg-gray-200 transition"
                      data-sortable="total_tasks" aria-label="Sort by total tasks">
                    Tasks
                    <span class="sort-arrow ml-1">↕</span>
                  </th>
                  <th class="px-4 py-3 text-right text-sm font-semibold text-gray-700 cursor-pointer hover:bg-gray-200 transition"
                      data-sortable="completed_tasks" aria-label="Sort by completed tasks">
                    Completed
                    <span class="sort-arrow ml-1">↕</span>
                  </th>
                </tr>
              </thead>
              <tbody id="agentTableBody">
                <!-- Populated by JavaScript -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>

  </div>

</body>

</html>
