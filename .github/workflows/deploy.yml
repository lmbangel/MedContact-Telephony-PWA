name: Build and Deploy to Digital Ocean

# Required GitHub Secrets:
#   DIGITALOCEAN_ACCESS_TOKEN - DO API token with read/write access
#   REGISTRY_NAME - Name of your DO Container Registry (e.g., "myregistry")
#   APP_ID - Your DO App Platform app ID (find via: doctl apps list)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}
  IMAGE_NAME: medcontact-ap

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: |
          echo "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" | \
          docker login registry.digitalocean.com \
            --username oauth2 \
            --password-stdin

      - name: Build and push API image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:api-${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:api-latest \
            ./api
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:api-${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:api-latest

      - name: Build and push Frontend image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:frontend-${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:frontend-latest \
            ./app
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:frontend-${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:frontend-latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy to App Platform
        run: doctl apps create-deployment ${{ secrets.APP_ID }} --wait
