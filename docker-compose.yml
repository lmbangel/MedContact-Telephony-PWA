services:
  # Go API Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: medcontact-api-local
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_PATH: /app/data/omnicall.db
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET}
      TWILIO_TWIML_APP_SID: ${TWILIO_TWIML_APP_SID}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./data:/app/data
    networks:
      - medcontact-local
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Vite Frontend
  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: medcontact-frontend-local
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - medcontact-local
    depends_on:
      - api

networks:
  medcontact-local:
    driver: bridge

volumes:
  local-data:
